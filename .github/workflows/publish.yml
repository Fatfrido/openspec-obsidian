name: Publish

# Publishes openspec-obsidian to the public npm registry.
# Trigger: a published GitHub Release (tag it v<version>, matching package.json),
# or a manual run. Authentication is tokenless via npm Trusted Publishing (OIDC):
# configure a Trusted Publisher for this package on npmjs.com (provider GitHub
# Actions, repo Fatfrido/openspec-obsidian, workflow file publish.yml). npm then
# attests provenance automatically; no NPM_TOKEN secret is required.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest # Trusted Publishing requires a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write # OIDC identity token for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          expected="v${pkg_version}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${pkg_version}' (expected '${expected}'). Retag the release or bump package.json."
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} matches package.json version ${pkg_version}."
      # Node 20 ships npm 10.x; tokenless Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --access public

  changelog:
    name: Record changelog
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the generated changelog note to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history so the commit range resolves
          fetch-tags: true # tags are the release anchors the command reads
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate changelog section for the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node bin/cli.mjs changelog --release "$TAG"
      - name: Commit and push the changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$(git status --porcelain openspec/changelog.md)" ]; then
            echo "No changelog change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec/changelog.md
          git commit -m "docs(changelog): ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
