name: Publish

# Publishes openspec-obsidian to the public npm registry.
# Trigger: a published GitHub Release. The release tag (v<version>) is the source
# of truth for the published version — package.json is stamped from it at publish
# time, so no manual version bump is required. Or run manually via workflow_dispatch.
# Authentication is tokenless via npm Trusted Publishing (OIDC):
# configure a Trusted Publisher for this package on npmjs.com (provider GitHub
# Actions, repo Fatfrido/openspec-obsidian, workflow file publish.yml). npm then
# attests provenance automatically; no NPM_TOKEN secret is required.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest # Trusted Publishing requires a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write # OIDC identity token for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Set package.json version from release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "Set package.json version to ${version} from release tag ${RELEASE_TAG}."
      # Node 20 ships npm 10.x; tokenless Trusted Publishing needs npm >= 11.5.1.
      # Pin to npm 11.x: npm@latest is now 12.x, which dropped Node 20 (requires Node >= 22).
      - run: npm install -g npm@^11.5.1
      - run: npm test
      - run: npm publish --access public

  changelog:
    name: Record changelog
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the generated changelog note to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history so the commit range resolves
          fetch-tags: true # tags are the release anchors the command reads
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate changelog section for the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node bin/cli.mjs changelog --release "$TAG"
      - name: Commit and push the changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$(git status --porcelain openspec/changelog.md)" ]; then
            echo "No changelog change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec/changelog.md
          git commit -m "docs(changelog): ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
