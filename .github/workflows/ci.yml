name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @fission-ai/openspec@1.4.1
      - run: openspec validate --all --strict --no-interactive
      # This repo dogfoods openspec-obsidian, so gate with the local CLI
      # (external repos would use: npx github:Fatfrido/openspec-obsidian check).
      - run: node bin/cli.mjs check
